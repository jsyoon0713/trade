swing:
  enabled: true
  watchlist:
  - 005930
  - '000660'
  - '035420'
  capital: 500000
  order_amount: 500000
  max_positions: 5
  stop_loss_pct: -5.0
  take_profit_pct: 10.0
  rsi:
    period: 14
    oversold: 30.0
    overbought: 70.0
    candle_interval: D
daytrading:
  enabled: true
  scan_top_n: 20
  capital: 300000
  # 당일 목표 수익률 (%) — 08:30 준비 시 변경 가능
  daily_target_pct: 1.5
  # 적극도: 적극 / 보통 / 소극 — 08:30 준비 시 변경 가능
  aggressiveness: 보통
  force_close_time: '15:20'
  candle_interval: '5'
scheduler:
  daytrading_prep: 08:30
  market_open: 09:01
  swing_interval_minutes: 30
  daytrading_force_close: '15:20'
  daily_report: '15:35'
news_analysis:
  enabled: true
  provider: auto
  model: ''
  lookback_days: 3
  block_buy_on_negative: true
  include_dart: true
macro_analysis:
  enabled: true
  provider: auto
  model: ''
  update_interval_minutes: 60
  pre_market_time: 08:20
  apply_to_swing: true
  apply_to_day: true
backtest:
  start_date: '2023-01-01'
  end_date: '2024-12-31'
  initial_capital: 10000000
  daytrading:
    candle_interval: '5'
    volume_spike_ratio: 3.0
    momentum_threshold: 0.005
